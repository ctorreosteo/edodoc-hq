spring.application.name=EdodocHQ

# Carica anche variabili da file .env nella root del progetto (se presente)
spring.config.import=optional:file:.env[.properties]

# Se nessun profilo e' impostato (avvio IDE/locale tipico) usa "local".
# Profili disponibili: local, dev (docker compose), prod
spring.profiles.default=local

server.port=${SERVER_PORT:8081}

# Segreto di firma dei token (almeno 32 caratteri casuali). Fuori dal profilo local e' obbligatorio.
jwt.secret=${JWT_SECRET:}
# Durata del token in ore. Sui telefoni si rinnova da solo con il refresh token.
jwt.ore-validita.admin=${JWT_ORE_ADMIN:12}
jwt.ore-validita.paziente=${JWT_ORE_PAZIENTE:12}

# Primo avvio: crea l'utente dottore se la tabella e' vuota. Senza password non crea nulla.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Dati dimostrativi (pazienti finti) per provare il gestionale: mai in produzione
app.init.demo-enabled=${APP_INIT_DEMO_ENABLED:false}

# Account per la revisione di Apple e Google. Il dottore ha il ruolo REVISORE e non legge alcun dato (vedi Utente.Ruolo).
app.prova.dottore-email=${APP_PROVA_DOTTORE_EMAIL:}
app.prova.dottore-password=${APP_PROVA_DOTTORE_PASSWORD:}
app.prova.paziente-email=${APP_PROVA_PAZIENTE_EMAIL:}
app.prova.paziente-password=${APP_PROVA_PAZIENTE_PASSWORD:}

# CORS: gestionale e app mobile
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Link che il paziente riceve per impostare la password dell'app mobile
app.applicazione.imposta-password-url=${APP_IMPOSTA_PASSWORD_URL:edodoc://imposta-password}
app.applicazione.invito-validita-ore=${APP_INVITO_VALIDITA_ORE:168}
# Giorni senza aprire l'app dopo i quali serve di nuovo la password
app.applicazione.sessione-giorni=${APP_SESSIONE_GIORNI:60}

# Notifiche push dell'app, si accendono da Impostazioni (config PUSH_ENABLED).
# iOS: chiave .p8 di APNs. Sandbox solo per le build lanciate da Xcode, TestFlight e App Store sono produzione.
app.push.apns.team-id=${APNS_TEAM_ID:}
app.push.apns.key-id=${APNS_KEY_ID:}
app.push.apns.key-path=${APNS_KEY_PATH:}
app.push.apns.topic=${APNS_TOPIC:it.edodoc.app}
app.push.apns.sandbox=${APNS_SANDBOX:false}
# Android: JSON del Service Account del progetto Firebase
app.push.fcm.credentials-path=${FCM_CREDENTIALS_PATH:}

# Google Workspace: file JSON del Service Account con domain-wide delegation.
# Calendar e Gmail si accendono dalla tabella config (vedi docs in README).
app.google.credentials-path=${GOOGLE_CREDENTIALS_PATH:}
# Su Cloud Run niente file: il Service Account firma via IAM (serve Token Creator su se stesso).
app.google.senza-chiave=${GOOGLE_SENZA_CHIAVE:false}

# Cloudflare Stream: video dei corsi. Si accende da Impostazioni (config CLOUDFLARE_STREAM_ENABLED).
app.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
app.cloudflare.stream-api-token=${CLOUDFLARE_STREAM_API_TOKEN:}
app.cloudflare.base-url=${CLOUDFLARE_BASE_URL:https://api.cloudflare.com/client/v4}

# Upload: il massimo serve ai video del Planner social (100 MB). LimiteUploadFilter tiene gli allegati email a 34 MB
# e tutti gli altri a 6 MB: i video dei corsi vanno direttamente dal browser a Cloudflare
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:edodochq}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Lo schema lo governa Flyway: Hibernate verifica soltanto
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Rome
spring.jpa.properties.hibernate.default_batch_fetch_size=25

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=Europe/Rome
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.file.name=logs/edodoc-hq.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=10

# Niente valori rifiutati nei log: i dati dei check e delle anagrafiche sono sanitari
spring.mvc.log-resolved-exception=false

# Assistente AI (Email Marketing): spento senza chiave
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}

# Email Marketing: indirizzo pubblico del backend (pixel, click, disiscrizione) e pagina preferenze del gestionale
app.mailing.url-pubblico=${MAILING_URL_PUBBLICO:http://localhost:8081}
app.mailing.url-preferenze=${MAILING_URL_PREFERENZE:http://localhost:5174/preferenze-email}

# Planner social: pubblicatori. Ogni canale resta spento finché mancano le sue credenziali
# TikTok (Content Posting API): app TikTok for Developers, redirect verso la callback del gestionale
planner.tiktok.client-key=${TIKTOK_CLIENT_KEY:}
planner.tiktok.client-secret=${TIKTOK_CLIENT_SECRET:}
planner.tiktok.redirect-uri=${TIKTOK_REDIRECT_URI:https://hq.edodoc.it/oauth/tiktok/callback}
# Google Business: la scheda di EdoDoc; identità OAuth utente oppure l'account di servizio con delega (scope business.manage)
google.business.location.id=${GOOGLE_BUSINESS_LOCATION:}
google.business.account.id=${GOOGLE_BUSINESS_ACCOUNT_ID:}
google.business.maps-link=${GOOGLE_BUSINESS_MAPS_LINK:}
google.business.oauth.client.id=${GOOGLE_BUSINESS_OAUTH_CLIENT_ID:}
google.business.oauth.client.secret=${GOOGLE_BUSINESS_OAUTH_CLIENT_SECRET:}
google.business.oauth.refresh.token=${GOOGLE_BUSINESS_OAUTH_REFRESH_TOKEN:}
# Trascrizione OpenAI (testo dal video): spenta senza OPENAI_API_KEY; con ffmpeg l'audio va a segmenti
openai.whisper.model=${OPENAI_WHISPER_MODEL:gpt-transcribe}
openai.whisper.language=it
openai.whisper.ffmpeg-command=${FFMPEG_COMMAND:ffmpeg}
openai.whisper.chunk-segment-seconds=120
openai.whisper.parallel-requests=8

# Planner social (Marketing > Planner): piano editoriale e pubblicazione sui social di EdoDoc.
# Base pubblica del backend (senza /api): Meta, Google e TikTok scaricano da qui i media da pubblicare.
# Vuota = nessuna pubblicazione automatica con media (le piattaforme non saprebbero dove prenderli).
app.planner.url-pubblico=${PLANNER_URL_PUBBLICO:}

# Pagina Meta (Facebook/Instagram). Webhook: /api/social/webhook (Page: feed, messages; Instagram: comments, mentions, messages)
meta.social.access-token=${META_SOCIAL_ACCESS_TOKEN:}
meta.social.page-ids=${META_SOCIAL_PAGE_IDS:}
meta.social.app-secret=${META_SOCIAL_APP_SECRET:}
meta.social.verify-token=${META_SOCIAL_VERIFY_TOKEN:}
meta.social.integrazione-abilitata=${SOCIAL_INTEGRAZIONE_ABILITATA:}
meta.social.webhook-firma-obbligatoria=${SOCIAL_WEBHOOK_FIRMA_OBBLIGATORIA:true}
meta.social.base-url=${META_GRAPH_BASE_URL:https://graph.facebook.com}
meta.social.versione=${META_GRAPH_VERSIONE:v25.0}
