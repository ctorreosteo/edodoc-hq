spring.application.name=EdodocHQ

# Carica anche variabili da file .env nella root del progetto (se presente)
spring.config.import=optional:file:.env[.properties]

# Se nessun profilo e' impostato (avvio IDE/locale tipico) usa "local".
# Profili disponibili: local, dev (docker compose), prod
spring.profiles.default=local

server.port=${SERVER_PORT:8081}

# Segreto di firma dei token (almeno 32 caratteri casuali). Fuori dal profilo local e' obbligatorio.
jwt.secret=${JWT_SECRET:}
# Durata del token in ore. Sui telefoni si rinnova da solo con il refresh token.
jwt.ore-validita.admin=${JWT_ORE_ADMIN:12}
jwt.ore-validita.paziente=${JWT_ORE_PAZIENTE:12}

# Primo avvio: crea l'utente dottore se la tabella e' vuota. Senza password non crea nulla.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Dati dimostrativi (pazienti finti) per provare il gestionale: mai in produzione
app.init.demo-enabled=${APP_INIT_DEMO_ENABLED:false}

# CORS: gestionale e app mobile
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Link che il paziente riceve per impostare la password dell'app mobile
app.applicazione.imposta-password-url=${APP_IMPOSTA_PASSWORD_URL:edodoc://imposta-password}
app.applicazione.invito-validita-ore=${APP_INVITO_VALIDITA_ORE:168}
# Giorni senza aprire l'app dopo i quali serve di nuovo la password
app.applicazione.sessione-giorni=${APP_SESSIONE_GIORNI:60}

# Notifiche push dell'app, si accendono da Impostazioni (config PUSH_ENABLED).
# iOS: chiave .p8 di APNs. Sandbox solo per le build lanciate da Xcode, TestFlight e App Store sono produzione.
app.push.apns.team-id=${APNS_TEAM_ID:}
app.push.apns.key-id=${APNS_KEY_ID:}
app.push.apns.key-path=${APNS_KEY_PATH:}
app.push.apns.topic=${APNS_TOPIC:it.edodoc.app}
app.push.apns.sandbox=${APNS_SANDBOX:false}
# Android: JSON del Service Account del progetto Firebase
app.push.fcm.credentials-path=${FCM_CREDENTIALS_PATH:}

# Google Workspace: file JSON del Service Account con domain-wide delegation.
# Calendar e Gmail si accendono dalla tabella config (vedi docs in README).
app.google.credentials-path=${GOOGLE_CREDENTIALS_PATH:}

# Cloudflare Stream: video dei corsi. Si accende da Impostazioni (config CLOUDFLARE_STREAM_ENABLED).
app.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
app.cloudflare.stream-api-token=${CLOUDFLARE_STREAM_API_TOKEN:}
app.cloudflare.base-url=${CLOUDFLARE_BASE_URL:https://api.cloudflare.com/client/v4}

# Upload: il massimo serve agli allegati email. Gli altri restano a 6 MB (LimiteUploadFilter):
# i video dei corsi vanno direttamente dal browser a Cloudflare
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=34MB

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:edodochq}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Lo schema lo governa Flyway: Hibernate verifica soltanto
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Rome
spring.jpa.properties.hibernate.default_batch_fetch_size=25

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=Europe/Rome
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.file.name=logs/edodoc-hq.log
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=10

# Niente valori rifiutati nei log: i dati dei check e delle anagrafiche sono sanitari
spring.mvc.log-resolved-exception=false
